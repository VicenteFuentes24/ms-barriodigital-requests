spring.application.name=ms-barriodigital-requests
server.port=${SERVER_PORT:8081}

spring.config.import=optional:file:.env[.properties],optional:file:./barriodigitalrequests/.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

server.error.include-stacktrace=never
server.error.include-message=never

spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.virtual-host=${RABBITMQ_VIRTUAL_HOST:barriodigital}
spring.rabbitmq.connection-timeout=${RABBITMQ_CONNECTION_TIMEOUT_MS:3000}ms
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.dynamic=false
barriodigital.rabbitmq.confirm-timeout-ms=${RABBITMQ_CONFIRM_TIMEOUT_MS:5000}

# Preserve the existing DB/HTTP health contract until broker readiness is integrated.
management.health.rabbit.enabled=${RABBITMQ_HEALTH_ENABLED:false}
