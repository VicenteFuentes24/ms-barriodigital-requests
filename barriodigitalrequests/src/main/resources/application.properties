spring.application.name=ms-barriodigital-requests
server.port=${SERVER_PORT:8081}

spring.config.import=optional:file:.env[.properties],optional:file:./barriodigitalrequests/.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

server.error.include-stacktrace=never
server.error.include-message=never

spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.virtual-host=${RABBITMQ_VIRTUAL_HOST:barriodigital}
spring.rabbitmq.connection-timeout=${RABBITMQ_CONNECTION_TIMEOUT_MS:3000}ms
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.dynamic=false
barriodigital.rabbitmq.confirm-timeout-ms=${RABBITMQ_CONFIRM_TIMEOUT_MS:5000}

# Preserve the existing DB/HTTP health contract until broker readiness is integrated.
management.health.rabbit.enabled=${RABBITMQ_HEALTH_ENABLED:false}

# Optional independent Kafka outbox. No automatic migration or topic creation.
barriodigital.kafka.enabled=${KAFKA_PUBLISHER_ENABLED:false}
barriodigital.kafka.topic=${KAFKA_REQUESTS_TOPIC:bd.requests.events.v1}
barriodigital.kafka.catalog-url=${CATALOG_SERVICE_URL:http://localhost:8082}
barriodigital.kafka.catalog-timeout-ms=${KAFKA_CATALOG_TIMEOUT_MS:2000}
barriodigital.kafka.batch-size=${KAFKA_OUTBOX_BATCH_SIZE:10}
barriodigital.kafka.send-timeout-ms=${KAFKA_SEND_TIMEOUT_MS:20000}
barriodigital.kafka.retry-initial-ms=${KAFKA_OUTBOX_RETRY_INITIAL_MS:2000}
barriodigital.kafka.retry-max-ms=${KAFKA_OUTBOX_RETRY_MAX_MS:60000}
barriodigital.kafka.worker-enabled=${KAFKA_OUTBOX_WORKER_ENABLED:true}
barriodigital.kafka.poll-ms=${KAFKA_OUTBOX_POLL_MS:1000}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:19092,localhost:29092,localhost:39092}
spring.kafka.admin.auto-create=false
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.delivery.timeout.ms=${KAFKA_DELIVERY_TIMEOUT_MS:15000}
spring.kafka.producer.properties.request.timeout.ms=${KAFKA_REQUEST_TIMEOUT_MS:10000}
spring.kafka.producer.properties.max.block.ms=${KAFKA_MAX_BLOCK_MS:10000}
spring.kafka.producer.properties.retry.backoff.ms=${KAFKA_PRODUCER_BACKOFF_MS:500}
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
